# docker-compose.yml (in your project's root directory)
version: '3.8'

services:
  
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017" # Expose DB port to host (optional, for debugging)
    volumes:
      - mongo-data:/data/db
    networks:
      - task-net

  # Backend API Service
  backend:
    build: ./backend
    container_name: backend-api
    ports:
      - "5000:5000" # Expose API port to host
    environment:
      # Use the service name 'mongodb' as the host
      MONGO_URI: mongodb://mongodb:27017/smart-task-db 
      PORT: 5000
      OPENAI_API_KEY: ${OPENAI_API_KEY} # Pulls from .env file
    depends_on:
      - mongodb
    networks:
      - task-net

  # Frontend (React + Nginx) Service
  frontend:
    build: ./frontend
    container_name: frontend-client
    ports:
      - "80:80" # App will be available on http://localhost
    depends_on:
      - backend
    networks:
      - task-net

# Define the network
networks:
  task-net:
    driver: bridge

# Define the persistent volume for MongoDB
volumes:
  mongo-data: